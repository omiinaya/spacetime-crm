# SpacetimeCRM nginx config — reverse proxy + TLS termination + static serving
#
# Deploy:
#   sudo cp deploy/nginx/spacetime-crm.conf /etc/nginx/sites-available/spacetime-crm
#   sudo ln -sf /etc/nginx/sites-available/spacetime-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (self-signed for testing — replace with Let's Encrypt for production):
#   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/spacetime-crm.key \
#     -out /etc/ssl/certs/spacetime-crm.crt \
#     -subj "/CN=spacetime-crm.local"
#
# Let's Encrypt (production):
#   sudo certbot --nginx -d your-domain.com

# ── HTTP → HTTPS redirect ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain (e.g. crm.example.com)

    # Let's Encrypt ACME challenge (uncomment for production)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # Replace with your domain

    # TLS certificates
    ssl_certificate     /etc/ssl/certs/spacetime-crm.crt;
    ssl_certificate_key /etc/ssl/private/spacetime-crm.key;

    # Modern TLS config (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # DH params (generate with: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048)
    # ssl_dhparam /etc/ssl/certs/dhparam.pem;

    # HSTS (uncomment only after verifying TLS works)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CSP — relaxed for SPA with inline styles/scripts and API connections
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        media-src 'self' https:;
        connect-src 'self' https://192.168.1.10:* wss://192.168.1.10:* http://localhost:* ws://localhost:*;
        frame-src 'self' https:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ── Static file serving (SPA) ─────────────────────────────
    # When backend serves static files directly (default Docker setup)
    # Uses backend's /web/dist directory via FastAPI
    # OR we point directly at the docker-mounted dist

    # All /api/* and /docs routes go to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # STDB direct access (useful for debugging)
    location /v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # FastAPI docs / OpenAPI
    location /docs {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /api/health/ {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Hashed static assets — long cache
    location /assets/ {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other routes → index.html
    location / {
        proxy_pass http://127.0.0.1:8723;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SPA routing: try_files won't work over proxy,
        # so let backend handle SPA fallback (it already does via FastAPI static files)
        proxy_intercept_errors off;
    }

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/spacetime-crm-access.log;
    error_log  /var/log/nginx/spacetime-crm-error.log;
}
