[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "spacetime-crm-server"
version = "0.1.0"
description = "Spacetime CRM Python backend server"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.14.1",
    "bcrypt==5.0.0",
    "cbor2==6.1.2",
    "certifi==2026.6.17",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.2",
    "cryptography==49.0.0",
    "Deprecated==1.3.1",
    "fastapi==0.139.0",
    "greenlet==3.5.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "idna==3.18",
    "Jinja2==3.1.6",
    "ldap3==2.9.1",
    "limits==5.8.0",
    "MarkupSafe==3.0.3",
    "playwright==1.61.0",
    "pyasn1==0.6.3",
    "pyasn1_modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.3.0",
    "PyJWT==2.13.0",
    "PyOTP==2.10.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.32",
    "PyYAML==6.0",
    "ruff==0.15.14",
    "six==1.16.0",
    "slowapi==0.1.10",
    "sniffio==1.3.1",
    "spacetimedb-sdk==0.7.0",
    "SQLAlchemy==2.0.50",
    "starlette==1.3.1",
    "stripe==15.3.0",
    "tenacity==9.1.4",
    "typing_extensions==4.15.0",
    "ujson==5.13.0",
    "urllib3==2.7.0",
    "uvicorn==0.29.0",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-timeout==2.4.0",
]

[project.scripts]
server = "main:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
