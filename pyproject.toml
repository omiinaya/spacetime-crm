[project]
name = "spacetime-crm"
version = "2.0.0"
description = "RepairShopr-inspired CRM built on SpacetimeDB"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SpacetimeCRM" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "jinja2>=3.1",
    "weasyprint>=63",
    "stripe>=11.0",
    "twilio>=9.0",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "sanitize>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "playwright>=1.49",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "server"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks end-to-end tests",
]

[tool.coverage.run]
source = ["server"]
omit = [
    "*/tests/*",
    "server/main.py",
    "server/config.py",
    "server/templates/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
# Configuration lives in ruff.toml

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
