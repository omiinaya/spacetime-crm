name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-test-secret-key-change-in-production
  STDB_HOST: localhost
  STDB_PORT: "3001"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install ruff
      - name: Install Node deps
        run: npm ci
        working-directory: web
      - name: Lint Python (ruff)
        run: ruff check server/ scripts/ || true
      - name: Lint Rust (clippy)
        run: cargo clippy --manifest-path server/spacetimedb/Cargo.toml -- -D warnings || true

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Node deps
        run: npm ci
        working-directory: web
      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: web

  test:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      spacetimedb:
        image: spacetimedb/spacetimedb:latest
        ports:
          - 3001:3001
        options: >-
          --health-cmd "curl -sf http://localhost:3001/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest
      - name: Install Node deps
        run: npm ci
        working-directory: web
      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: web
      - name: Install SpacetimeDB CLI
        run: |
          curl -fsSL https://github.com/clockworklabs/SpacetimeDB/releases/latest/download/spacetime-linux-x86_64.tar.gz -o /tmp/spacetime.tar.gz
          tar -xzf /tmp/spacetime.tar.gz -C /usr/local/bin
          spacetime version
      - name: Publish module
        run: |
          cd server/spacetimedb
          spacetime publish --server http://localhost:3001 --yes spacetime-crm
      - name: Seed demo data
        run: |
          cd server
          python3 -u seed-demo.py 2>&1 || echo "Seed may have partial data"
      - name: Start API server
        run: |
          cd server
          python3 main.py &
          sleep 3
        env:
          STDB_HOST: localhost
          STDB_PORT: "3001"
          JWT_SECRET: ci-test-secret-key-change-in-production
          SERVER_PORT: "8723"
      - name: Wait for API server readiness
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8723/api/health/ready > /dev/null 2>&1; then
              echo "API server ready"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 2
          done
          echo "API server failed to start"
          exit 1
      - name: Run backend tests
        run: |
          cd server
          python -m pytest tests/ -v --tb=short 2>&1
      - name: Run frontend unit tests
        run: npx vitest run
        working-directory: web
      - name: Run E2E tests
        run: npx playwright test --workers=2
        working-directory: web

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Node deps
        run: npm ci
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web
      - name: Check Rust compilation
        run: cargo check --manifest-path server/spacetimedb/Cargo.toml 2>&1
        continue-on-error: true
