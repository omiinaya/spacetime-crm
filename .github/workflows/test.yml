name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-test-secret-key-change-in-production
  STDB_HOST: localhost
  STDB_PORT: "3001"
  # Version pinned to match production (server/.local/share/spacetime/bin/2.6.1)
  # and server/Dockerfile.test. The old `spacetimedb/spacetimedb:latest` image
  # does NOT exist on Docker Hub — every Test run failed at `docker pull`.
  SPACETIME_VERSION: v2.6.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install SpacetimeDB CLI + standalone server
        run: |
          curl -L -o /tmp/spacetime.tar.gz \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/${SPACETIME_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/spacetime.tar.gz -C /usr/local/bin/
          rm /tmp/spacetime.tar.gz
          if [ -f /usr/local/bin/spacetimedb-cli ] && [ ! -f /usr/local/bin/spacetime ]; then
            mv /usr/local/bin/spacetimedb-cli /usr/local/bin/spacetime
          fi
          chmod +x /usr/local/bin/spacetime /usr/local/bin/spacetimedb-standalone 2>/dev/null || true
          spacetime --version

      - name: Start SpacetimeDB standalone
        run: |
          spacetime start -l 0.0.0.0:3001 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ > /dev/null 2>&1; then
              echo "SpacetimeDB ready"
              exit 0
            fi
            echo "Waiting for SpacetimeDB... ($i/30)"
            sleep 1
          done
          echo "SpacetimeDB failed to start"
          exit 1

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend unit tests
        run: npx vitest run
        working-directory: web

      - name: Type-check E2E specs
        run: npx tsc -p tsconfig.e2e.json --noEmit
        working-directory: web

      - name: Build STDB module
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path server/spacetimedb/Cargo.toml

      - name: Publish STDB module
        run: |
          cd server/spacetimedb
          spacetime publish --server http://localhost:3001 --yes spacetime-crm 2>&1 || (
            echo "Retrying publish after 5s..."
            sleep 5
            spacetime publish --server http://localhost:3001 --yes spacetime-crm
          )

      - name: Seed demo data
        run: |
          cd server
          python3 -u seed-demo.py 2>&1 || echo "Seed may have partial data — tests should still run"

      - name: Start API server
        run: |
          cd server
          python3 main.py &
          sleep 3
        env:
          STDB_HOST: localhost
          STDB_PORT: "3001"
          JWT_SECRET: ci-test-secret-key-change-in-production
          SERVER_PORT: "8723"

      - name: Wait for API server readiness
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8723/api/health/ready > /dev/null 2>&1; then
              echo "API server ready"
              exit 0
            fi
            echo "Waiting for API server... ($i/10)"
            sleep 2
          done
          echo "API server failed to start"
          exit 1

      - name: Run backend tests
        run: |
          cd server
          python3 -m pytest tests/ -v --tb=short 2>&1

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Start frontend preview server (built assets)
        run: |
          nohup npm run preview > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5185/ > /dev/null 2>&1; then
              echo "Frontend preview ready on :5185"
              exit 0
            fi
            echo "Waiting for preview server... ($i/15)"
            sleep 2
          done
          echo "Frontend preview failed to start:"
          cat /tmp/vite-preview.log
          exit 1
        working-directory: web

      - name: Run E2E tests
        run: npx playwright test
        working-directory: web
        # E2E tests use fake JWT auth (no real backend needed for UI rendering tests).
        # They run against the BUILT frontend served by the preview server above
        # (webServer is undefined in CI — Playwright does not auto-start the dev
        # server, so E2E would otherwise hit connection-refused on :5185).
        # Workers stay at config default (1): parallel workers contend on one
        # Vite server and cause timeouts (documented pitfall in playwright.config.ts).

      - name: Run Rust clippy
        run: cargo clippy --manifest-path server/spacetimedb/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Run Rust tests (host)
        run: cargo test --manifest-path server/spacetimedb/Cargo.toml --lib
        # Unit tests execute on the host via the in-memory test stub datastore
        # (src/test_stubs.rs) — no live SpacetimeDB required.

  # Container-based integration suite (ROADMAP 'Test coverage'):
  # boots the STDB container and runs scripts/run-integration-tests.sh —
  # build → container → publish → backend → bootstrap → pytest →
  # Rust container tests → cleanup. This is exactly what `make test-container`
  # resolves to when Docker is available.
  test-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install SpacetimeDB CLI
        run: |
          curl -L -o /tmp/spacetime.tar.gz \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/${SPACETIME_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/spacetime.tar.gz -C /usr/local/bin/
          rm /tmp/spacetime.tar.gz
          if [ -f /usr/local/bin/spacetimedb-cli ] && [ ! -f /usr/local/bin/spacetime ]; then
            mv /usr/local/bin/spacetimedb-cli /usr/local/bin/spacetime
          fi
          chmod +x /usr/local/bin/spacetime /usr/local/bin/spacetimedb-standalone 2>/dev/null || true
          spacetime --version

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest

      # Ports: STDB on 3002 (ephemeral container, non-conflicting with the
      # host-gate job's :3001), backend on 8723. The runner script owns the
      # full lifecycle and cleans up the container afterwards.
      - name: Run container-based integration tests
        run: bash scripts/run-integration-tests.sh
        env:
          STDB_PORT: "3002"
          BACKEND_PORT: "8723"
