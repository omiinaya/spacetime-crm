name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: ci-test-secret-key-change-in-production
  STDB_HOST: localhost
  STDB_PORT: "3001"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      spacetimedb:
        image: spacetimedb/spacetimedb:latest
        ports:
          - 3001:3001
        options: >-
          --health-cmd "curl -sf http://localhost:3001/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run frontend unit tests
        run: npx vitest run
        working-directory: web

      - name: Build STDB module
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path server/spacetimedb/Cargo.toml

      - name: Publish STDB module
        run: |
          cd server/spacetimedb
          spacetime publish --server http://localhost:3001 --yes spacetime-crm 2>&1 || (
            echo "Retrying publish after 5s..."
            sleep 5
            spacetime publish --server http://localhost:3001 --yes spacetime-crm
          )

      - name: Seed demo data
        run: |
          cd server
          python3 -u seed-demo.py 2>&1 || echo "Seed may have partial data — tests should still run"

      - name: Start API server
        run: |
          cd server
          python3 main.py &
          sleep 3
        env:
          STDB_HOST: localhost
          STDB_PORT: "3001"
          JWT_SECRET: ci-test-secret-key-change-in-production
          SERVER_PORT: "8723"

      - name: Wait for API server readiness
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8723/api/health/ready > /dev/null 2>&1; then
              echo "API server ready"
              exit 0
            fi
            echo "Waiting for API server... ($i/10)"
            sleep 2
          done
          echo "API server failed to start"
          exit 1

      - name: Run backend tests
        run: |
          cd server
          python3 -m pytest tests/ -v --tb=short 2>&1

      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: web

      - name: Run E2E tests
        run: npx playwright test --workers=2
        working-directory: web
        # E2E tests use fake JWT auth (no real backend needed for UI rendering tests)

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Run Rust clippy
        run: cargo clippy --manifest-path server/spacetimedb/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
        continue-on-error: true

      - name: Verify Rust tests compile
        run: cargo check --manifest-path server/spacetimedb/Cargo.toml --tests 2>&1
        # Tests type-check successfully but can't link on host (STDB runtime symbols
        # only available in wasm). Actual execution requires the SpacetimeDB host runtime.
        continue-on-error: true
