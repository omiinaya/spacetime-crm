version: "3.8"

services:
  spacetime:
    # Official SpacetimeDB image (CLI + embedded standalone). Version pinned to
    # match production (2.6.1). NOTE: `spacetimedb/spacetimedb:*` does NOT exist
    # on Docker Hub — the old reference made `docker compose up` fail.
    image: clockworklabs/spacetime:v2.6.1
    command: ["start", "-l", "0.0.0.0:3001"]
    ports:
      - "3001:3001"
    volumes:
      # `spacetime start` stores replica data under $HOME/.local/share/spacetime
      # (container user `spacetime`, HOME=/home/spacetime)
      - spacetime_data:/home/spacetime/.local/share/spacetime
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${SERVER_PORT:-8723}:8723"
    environment:
      - STDB_HOST=spacetime
      - STDB_PORT=3001
      - STDB_DB=${STDB_DB:-spacetime-crm}
      - SERVER_PORT=8723
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8723}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
    depends_on:
      spacetime:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8723/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  spacetime_data:
